name: CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-24.04
            target: x86_64
            rustflags: "-C linker-features=-lld"
          - runner: ubuntu-24.04-arm
            target: aarch64
            rustflags: ""
          - runner: windows-latest
            target: AMD64
          - runner: macos-14
            target: arm64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.10'
      - name: Install LLVM and Clang
        if: runner.os == 'macOS'
        run: |
          brew install llvm@21
          echo "LLVM_PATH=$(brew --prefix llvm@21)" >> $GITHUB_ENV
      - name: Build wheels
        uses: pypa/cibuildwheel@294735312765b09d24a2fbec22660ce817587d55 # v4.1.0
        env:
          CIBW_BUILD_VERBOSITY: "1"
          CIBW_BUILD: >-
            cp310-manylinux_x86_64
            cp310-manylinux_aarch64
            cp310-macosx_arm64
            cp310-win_amd64
          CIBW_ARCHS_LINUX: ${{ matrix.platform.target }}
          CIBW_ARCHS_MACOS: ${{ matrix.platform.target }}
          CIBW_ARCHS_WINDOWS: ${{ matrix.platform.target }}
          SCCACHE_VERSION: 0.2.13
          CIBW_BEFORE_ALL_LINUX: |
            curl https://sh.rustup.rs -sSf | sh -s -- --default-toolchain stable -y
            source .github/scripts/maturin_linux_setup.sh
          CIBW_BEFORE_ALL_MACOS: |
            brew install gcc suite-sparse
          CIBW_ENVIRONMENT_LINUX: >-
            MATURIN_PEP517_ARGS="--features diffsol-llvm21 --features suitesparse"
            RUSTFLAGS="${{ matrix.platform.rustflags }}"
          CIBW_ENVIRONMENT_MACOS: >-
            SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
            MACOSX_DEPLOYMENT_TARGET=14.0
            DYLD_FALLBACK_LIBRARY_PATH="$(brew --prefix gcc)/lib/gcc/current"
            MATURIN_PEP517_ARGS="--features diffsol-llvm21 --features suitesparse"
          CIBW_ENVIRONMENT_WINDOWS: >-
            MATURIN_PEP517_ARGS="--features diffsol-cranelift"

      - name: Upload wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.platform.runner }}-${{ matrix.platform.target }}
          path: ./wheelhouse/*.whl
      - name: pytest
        shell: bash
        env:
          ACTIVATE: ${{ runner.os == 'Windows' && '.venv/Scripts/activate' || '.venv/bin/activate' }}
          # FIXME restore to 'test examples/* bench/main_bench.py'. Temporarily disabled for work on config branch
          PYTEST_DIRS: ${{ runner.os == 'macOS' && 'test' || 'test examples/*' }} # MacOS runner fails with LLVM and matplotlib
        run: |
          set -e
          python3 -m venv .venv
          source $ACTIVATE
          pip install "$(echo ./wheelhouse/*cp310*.whl)[dev,bench]" # Explicit local whl avoids falling back to PyPI
          pytest -s -v $PYTEST_DIRS

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          args: --release --out dist --sdist --features diffsol-cranelift
      - name: Remove wheels, just keep sdist
        run: rm -rf dist/*.whl
      - name: Upload sdist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-sdist
          path: dist

  release:
    name: Release
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    needs: [wheels, sdist]
    permissions:
      id-token: write # Use to sign the release artifacts
      contents: write # Used to upload release artifacts
      attestations: write # Used to generate artifact attestation
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'wheels-*/*'
      - name: Publish to PyPI
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          command: upload
          args: --non-interactive --skip-existing wheels-*/*
